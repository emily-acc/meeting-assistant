<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會議行程助理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; }
    .app { background: white; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #1C2B4A 0%, #2a3f5f 100%); color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 24px; margin: 0; }
    .content { flex: 1; padding: 20px; text-align: center; }
    .status { font-size: 18px; color: #1C2B4A; margin: 20px 0; }
    .btn { padding: 12px 24px; background: #1C2B4A; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; }
    .btn:hover { background: #2a3f5f; }
    .info { background: #f0f5f9; padding: 20px; border-radius: 8px; margin: 20px 0; line-height: 1.6; color: #444; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>📅 會議行程助理</h1>
    </div>
    <div class="content">
      <div class="status">✅ 應用已上線！</div>
      <div class="info">
        <h2>🎉 恭喜！</h2>
        <p>你的會議行程助理已成功部署到 Vercel。</p>
        <p><strong>部署網址：</strong></p>
        <p>https://meeting-assistant-b21e1s1qk-team-meeting.vercel.app</p>
        <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
        <p>下一步：完成所有 App 檔案上傳，就能使用完整功能</p>
        <p>包括：解析會議、行事曆、Google Calendar 同步等</p>
      </div>
      <button class="btn" onclick="alert('會議助理已就緒！')">確認</button>
    </div>
  </div>
</body>
</html>
